<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assembly layout concept</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: white; color: #202020; }
    .viewer { height: 100svh; padding: 12px 24px max(12px, env(safe-area-inset-bottom)); display: grid; grid-template-rows: 44px minmax(0, 1fr) 72px; }
    header { display: flex; justify-content: flex-end; align-items: center; position: relative; z-index: 1; }
    details { font-size: 13px; }
    summary { cursor: pointer; min-height: 44px; padding: 14px 4px; }
    .help { position: absolute; right: 0; top: 44px; width: min(360px, calc(100vw - 40px)); padding: 20px; background: white; border: 1px solid #ddd; box-shadow: 0 8px 30px #0000000d; line-height: 1.6; }
    .help p { margin: 0 0 12px; }
    .help p:last-child { margin: 0; }
    .artwork { min-height: 0; min-width: 0; display: flex; justify-content: center; align-items: center; }
    img { display: block; width: auto; height: auto; max-width: 100%; max-height: 100%; clip-path: inset(0 0 5.925926%); }
    footer { width: min(100%, 760px); justify-self: center; align-self: end; }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
    button { min-height: 44px; padding: 8px; border: 0; background: transparent; color: #686868; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
    button[aria-current] { color: #202020; font-weight: 700; }
    button span { margin-right: 7px; font-size: 11px; }
    :is(button, summary):focus-visible { outline: 2px solid #202020; outline-offset: 3px; }
    .track { height: 2px; margin-top: 8px; background: #e8e8e8; }
    .fill { width: 100%; height: 100%; background: #202020; transform-origin: left; transform: scaleX(.30714); }
    @media (orientation: portrait) { img { clip-path: inset(0 0 3.333334%); } }
    @media (max-width: 600px) {
      .viewer { padding-left: 14px; padding-right: 14px; }
      button { padding: 5px 3px; font-size: 11px; }
      button span { display: block; margin: 0 0 5px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="viewer">
    <header>
      <details>
        <summary>Instructions &amp; options</summary>
        <div class="help">
          <p><strong>Layout preview</strong><br>This concept uses chapter stills. Select a chapter below to compare the layout.</p>
          <p>The finished viewer would keep continuous scrolling, an optional still mode and written assembly instructions here.</p>
          <p>Connector circles show enlarged views of the same connection.</p>
        </div>
      </details>
    </header>
    <picture class="artwork">
      <source media="(orientation: landscape)" srcset="../dist/assets/landscape/frame-0190.webp">
      <img src="../dist/assets/portrait/frame-0190.webp" alt="Connect the Wi-Fi antenna to XIAO, with a circular connector close-up.">
    </picture>
    <footer>
      <nav aria-label="Preview assembly chapters">
        <button data-frame="0034" data-progress="0" data-description="Check the four parts."><span>01</span> Parts</button>
        <button data-frame="0190" data-progress=".30714" data-description="Connect the Wi-Fi antenna to XIAO, with a circular connector close-up." aria-current="step"><span>02</span> Wi-Fi</button>
        <button data-frame="0295" data-progress=".55714" data-description="Connect the LoRa antenna to Wio, with a circular connector close-up."><span>03</span> LoRa</button>
        <button data-frame="0424" data-progress=".86429" data-description="Join the two boards at their rear connector."><span>04</span> Boards</button>
        <button data-frame="0481" data-progress="1" data-description="The completed kit faces the front."><span aria-hidden="true">✓</span> Assembled</button>
      </nav>
      <div class="track" aria-hidden="true"><div class="fill"></div></div>
    </footer>
  </main>
  <script>
    for (const button of document.querySelectorAll('button')) {
      button.addEventListener('click', () => {
        document.querySelector('source').srcset = `../dist/assets/landscape/frame-${button.dataset.frame}.webp`;
        const image = document.querySelector('img');
        image.src = `../dist/assets/portrait/frame-${button.dataset.frame}.webp`;
        image.alt = button.dataset.description;
        document.querySelector('.fill').style.transform = `scaleX(${button.dataset.progress})`;
        for (const item of document.querySelectorAll('button')) item.removeAttribute('aria-current');
        button.setAttribute('aria-current', 'step');
      });
    }
  </script>
</body>
</html>
